<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2b50cf"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<title>Lab Book Revision</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lab-notebook study desk. Fixed side rail on landscape tablets, bottom tab bar in portrait; one working column per view. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #e9edf3; --ink: #121821; --muted: #566072; --line: #d7dde6;
  --phys: #2b50cf; --phys-soft: #e3e9fb; --chem: #08795f; --chem-soft: #dcf1ea;
  --red: #c93b3b; --amber: #c27c00; --green: #23874f; --red-soft: #fbe5e5; --amber-soft: #fbefd8; --green-soft: #def2e6;
  --focus: #2b50cf; --shadow: 0 1px 2px rgba(18,24,33,.06), 0 4px 16px rgba(18,24,33,.05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Roboto Mono", Consolas, monospace;
  --r: 14px; --rail: 232px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --surface: #161b23; --surface-2: #1f2632; --ink: #e7ebf1; --muted: #9aa4b5; --line: #2a3240;
  --phys: #8aa6ff; --phys-soft: #1d2747; --chem: #43d0a7; --chem-soft: #12352c;
  --red: #f27474; --amber: #f0b445; --green: #52c98a; --red-soft: #3a1d1f; --amber-soft: #392b10; --green-soft: #15321f;
  --focus: #8aa6ff; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161b23; --surface-2: #1f2632; --ink: #e7ebf1; --muted: #9aa4b5; --line: #2a3240;
  --phys: #8aa6ff; --phys-soft: #1d2747; --chem: #43d0a7; --chem-soft: #12352c;
  --red: #f27474; --amber: #f0b445; --green: #52c98a; --red-soft: #3a1d1f; --amber-soft: #392b10; --green-soft: #15321f;
  --focus: #8aa6ff; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--phys); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font: 500 .75rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Shell */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }
body { --accent: var(--phys); --accent-soft: var(--phys-soft); }
body[data-subj="chem"] { --accent: var(--chem); --accent-soft: var(--chem-soft); }
.sheet .nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 14px; }
.sw { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 56px; padding: 8px 10px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; }
.sw-code { font-size: .68rem; letter-spacing: .04em; }
.sw-name { font: 700 .98rem/1.1 var(--f-display); }
.sw-n { position: absolute; top: 7px; right: 8px; font-size: .66rem; padding: 2px 6px; border-radius: 99px; background: var(--surface); color: var(--muted); }
.sw[aria-pressed="true"] { color: var(--bg); }
.sw-phys[aria-pressed="true"] { background: var(--phys); }
.sw-chem[aria-pressed="true"] { background: var(--chem); }
.sw[aria-pressed="true"] .sw-n { background: color-mix(in srgb, var(--bg) 25%, transparent); color: var(--bg); }
.sw:not([aria-pressed="true"]):hover { background: var(--surface); color: var(--ink); }
.rail .switch { margin: 0 2px 10px; }
.rail-label { padding: 14px 12px 6px; }
.subjbar { display: none; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 20px 12px 20px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 .95rem/1 var(--f-mono); }
.brand b { font: 800 1.05rem/1.1 var(--f-display); display: block; }
.brand span { font-size: .75rem; color: var(--muted); }
.nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer; font-weight: 500; color: var(--muted); }
.nav-btn svg { width: 20px; height: 20px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.brand-mark { background: var(--accent) !important; }
.nav-btn .count { margin-left: auto; font: 500 .75rem/1 var(--f-mono); background: var(--red); color: #fff; padding: 4px 7px; border-radius: 99px; }
.rail-foot { margin-top: auto; padding: 12px 10px 0; font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--green); } .dot.busy { background: var(--amber); } .dot.err { background: var(--red); }

.main { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.topbar .title { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.tabbar { display: none; }
.sheet-back { position: fixed; inset: 0; background: rgba(10,14,20,.45); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.sheet .nav-btn { background: var(--surface-2); color: var(--ink); }

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding-top: 0; }
  .subjbar { display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); padding: 12px 0; margin-bottom: 8px; max-width: 1040px; margin-inline: auto; }
  .subjbar .sw { min-height: 50px; flex-direction: row; align-items: center; gap: 10px; padding: 0 14px; }
  .tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 56px; justify-content: center; border: 0; background: none; color: var(--muted); font-size: .72rem; font-weight: 500; border-radius: 10px; cursor: pointer; position: relative; }
  .tab svg { width: 22px; height: 22px; }
  .tab[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
  .tab .badge { position: absolute; top: 4px; left: calc(50% + 6px); font: 500 .65rem/1 var(--f-mono); background: var(--red); color: #fff; padding: 3px 5px; border-radius: 99px; }
  h1 { font-size: 1.6rem; }
}

/* Building blocks */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 760px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.primary:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: .875rem; border-radius: 9px; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 40px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: .9rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 .75rem/1 var(--f-mono); padding: 5px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.phys { background: var(--phys-soft); color: var(--phys); }
.chip.chem { background: var(--chem-soft); color: var(--chem); }
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.amber { background: var(--amber-soft); color: var(--amber); }
.chip.green { background: var(--green-soft); color: var(--green); }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: .85rem; font-weight: 600; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-weight: 400; font-size: 1rem; }
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.empty { padding: 22px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--muted); text-align: center; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 2px; min-width: 0; }
.item-main { flex: 1; min-width: 0; }
.item-main b { font-weight: 600; display: block; }
button.item { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 8px; }
button.item:hover { background: var(--surface-2); }
.subj-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.subj-dot.phys { background: var(--phys); } .subj-dot.chem { background: var(--chem); }

/* Confidence bar */
.cbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); min-width: 60px; }
.cbar i { display: block; height: 100%; }
.cbar .r { background: var(--red); } .cbar .a { background: var(--amber); } .cbar .g { background: var(--green); }

/* Stat tiles */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat b { font: 700 1.9rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .muted { font-size: .82rem; }

/* Hero: today's desk */
.today { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .today { grid-template-columns: minmax(0, 1fr); } }
.due-card { background: var(--accent); color: var(--bg); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.due-card .big { font: 800 3.4rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.due-card .muted { color: inherit; opacity: .7; }
.due-card .btn.primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.due-card .split { display: flex; gap: 18px; flex-wrap: wrap; font-size: .9rem; }
.due-card .split span b { font-family: var(--f-mono); }

/* Heatmap */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 2px; }
.heat i { width: 14px; height: 14px; border-radius: 3px; background: var(--surface-2); display: block; }
.heat i.l1 { background: color-mix(in srgb, var(--green) 30%, var(--surface-2)); }
.heat i.l2 { background: color-mix(in srgb, var(--green) 55%, var(--surface-2)); }
.heat i.l3 { background: color-mix(in srgb, var(--green) 80%, var(--surface-2)); }
.heat i.l4 { background: var(--green); }
.heat i.today { outline: 2px solid var(--ink); outline-offset: -1px; }

/* Flashcard */
.study-stage { display: flex; flex-direction: column; gap: 16px; }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.flash { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; min-height: 320px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); cursor: pointer; }
.flash::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 20px 0 0 20px; background: var(--subj, var(--ink)); }
.flash.phys { --subj: var(--phys); } .flash.chem { --subj: var(--chem); }
.flash .q { font: 600 1.35rem/1.4 var(--f-body); }
.flash .a { font-size: 1.15rem; line-height: 1.55; border-top: 1px dashed var(--line); padding-top: 18px; white-space: pre-wrap; }
.flash .hint { margin-top: auto; color: var(--muted); font-size: .85rem; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.grade { min-height: 66px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; cursor: pointer; }
.grade small { font: 400 .75rem/1 var(--f-mono); color: var(--muted); }
.grade.again { color: var(--red); } .grade.hard { color: var(--amber); } .grade.good { color: var(--green); } .grade.easy { color: var(--phys); }
.grade:hover { background: var(--surface-2); }

/* Spec points */
.pt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 2px; }
.rag { display: inline-flex; gap: 6px; }
.rag button { width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font: 700 .8rem/1 var(--f-mono); cursor: pointer; color: var(--muted); }
.rag button.r[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.rag button.a[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #fff; }
.rag button.g[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

/* Equations and tables */
.eq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.eq-row { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; align-items: baseline; }
.eq-row + .eq-row { border-top: 1px solid var(--line); }
.eq-row .mono { font-size: .98rem; text-align: right; overflow-wrap: anywhere; }
.eq-row span:first-child { color: var(--muted); font-size: .88rem; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 10px 12px; vertical-align: top; }
th { font: 600 .75rem/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); }
tr + tr td { border-top: 1px solid var(--line); }

/* Periodic table */
.pt-wrap { overflow-x: auto; padding-bottom: 6px; }
.ptable { display: grid; grid-template-columns: repeat(18, minmax(46px, 1fr)); gap: 3px; min-width: 860px; }
.el { border-radius: 6px; padding: 4px 4px 5px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; font-family: var(--f-mono); line-height: 1.1; border: 0; color: var(--ink); cursor: pointer; }
.el .z { font-size: .6rem; color: var(--muted); align-self: flex-start; }
.el .s { font: 700 1rem/1.1 var(--f-display); }
.el .m { font-size: .62rem; color: var(--muted); }
.el.blk-s { background: color-mix(in srgb, var(--red) 16%, var(--surface)); }
.el.blk-p { background: color-mix(in srgb, var(--phys) 14%, var(--surface)); }
.el.blk-d { background: color-mix(in srgb, var(--amber) 18%, var(--surface)); }
.el.blk-f { background: color-mix(in srgb, var(--chem) 16%, var(--surface)); }
.el[aria-pressed="true"] { outline: 2px solid var(--ink); }

/* Tutor */
.answer { white-space: pre-wrap; line-height: 1.6; }
.score { font: 800 2.4rem/1 var(--f-display); font-variant-numeric: tabular-nums; }

/* Timer */
.clock { font: 700 clamp(4rem, 16vw, 8rem)/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; text-align: center; }
.ring { width: 100%; max-width: 360px; margin: 0 auto; display: block; }

/* Chart */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-mono); }

.pp-tick { width: 40px; height: 40px; flex: none; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--bg); font: 700 1.1rem/1 var(--f-body); cursor: pointer; }
.btn.missing { opacity: .5; border-style: dashed; }
.viewer { position: fixed; inset: 0; z-index: 60; background: var(--surface-2); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.vw-bar, .vw-sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.vw-bar { border-bottom: 1px solid var(--line); }
.vw-sub { justify-content: space-between; border-bottom: 1px solid var(--line); }
.vw-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vw-title b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vw-pages { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vw-page { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); flex: none; }
.vw-page canvas { display: block; }
.pp-links { flex-basis: 100%; padding-left: 52px; }
@media (min-width: 1100px) { .pp-links { flex-basis: auto; padding-left: 0; } }
.pp-tick[aria-pressed="true"] { background: var(--green); border-color: var(--green); }
details.disc { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.disc > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 12px; min-height: 56px; }
details.disc > summary::-webkit-details-marker { display: none; }
details.disc > summary::after { content: "+"; margin-left: auto; font: 500 1.3rem/1 var(--f-mono); color: var(--muted); }
details.disc[open] > summary::after { content: "−"; }

    settings: { theme: "system", physOpt: "", newPerDay: 20, subj: "phys" } };

function normalise(o) {
  const f = fresh();
  if (!o || typeof o !== "object") return f;
  for (const k in f) {
    if (o[k] == null || typeof o[k] !== typeof f[k] || Array.isArray(f[k]) !== Array.isArray(o[k])) o[k] = f[k];
  }
  o.settings = Object.assign(f.settings, o.settings);
  if (!SUBJ[o.settings.subj]) o.settings.subj = "phys";
  return o;
}

function indexCustom() {
  for (const id in CARDS) if (CARDS[id].custom) delete CARDS[id];

let docRef = null, sync = "local", writing = false, pendingWrite = false, syncTimer = null;
function setSync(s) { sync = s; for (const id of ["syncline", "syncline2"]) { const el = document.getElementById(id); if (el) el.innerHTML = syncHTML(); } }
function syncHTML() {

  return `<span class="dot ${m[0]}"></span><span>${m[1]}</span>`;
}
function queueRemote() { if (!docRef) return; clearTimeout(syncTimer); syncTimer = setTimeout(flushRemote, 1500); }
async function flushRemote() {
  if (!docRef) return;
  if (writing) { pendingWrite = true; return; }
  writing = true; setSync("busy");
  try { await docRef.set({ json: JSON.stringify(S), updated: S.updated }); setSync("ok"); }
  catch (e) { setSync("err"); }

}
async function initSync() {
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    docRef = db.collection("data/users/" + id).doc("progress");
    const snap = await Promise.race([docRef.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    if (snap.exists) {
      const data = snap.data() || {};
      let remote = null; try { remote = JSON.parse(data.json); } catch (e) { /* ignore */ }
      if (remote && (remote.updated || 0) > (S.updated || 0)) {
        S = normalise(remote); indexCustom();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }

}

/* ---------- Spaced repetition ---------- */
function schedule(id, g, now) {
  const c = S.srs[id] || { i: 0, e: 2.5, r: 0, l: 0, d: 0 };
  let { i, e, r, l } = c;
  if (g === 0) { return { i: 0, e: Math.max(1.3, e - 0.2), r: 0, l: l + 1, d: now + 10 * 60e3 }; }
  if (r === 0) i = g === 3 ? 4 : 1;
  else if (r === 1) i = g === 1 ? 2 : g === 2 ? 3 : 6;
  else i = g === 1 ? Math.max(i + 1, Math.round(i * 1.2)) : g === 2 ? Math.max(i + 1, Math.round(i * e)) : Math.max(i + 2, Math.round(i * e * 1.3));
  if (g === 1) e = Math.max(1.3, e - 0.15);
  if (g === 3) e = e + 0.15;
  return { i, e: +e.toFixed(2), r: r + 1, l, d: sod(now) + i * DAY + 4 * 3600e3 };
}
function ivlLabel(id, g) {
  if (g === 0) return "10 min";
  const d = schedule(id, g, Date.now()).i;
  return d < 31 ? d + (d === 1 ? " day" : " days") : d < 365 ? Math.round(d / 30) + " mo" : (d / 365).toFixed(1) + " yr";
}
const optOK = t => !t.opt || t.opt === S.settings.physOpt;
function topicsIn(scope) {
  if (TOPICS[scope]) return [TOPICS[scope]];
  return Object.values(TOPICS).filter(t => (scope === "both" || t.subj === scope) && optOK(t));
}
function newLeft() { return Math.max(0, (+S.settings.newPerDay || 0) - (S.newLog[dayKey()] || 0)); }
function queueFor(scope) {
  const now = Date.now(), due = [], unseen = [];
  for (const t of topicsIn(scope)) for (const id of t.cardIds) {
    const s = S.srs[id];
    if (!s) unseen.push(id); else if (s.d <= now) due.push(id);
  }
  due.sort((a, b) => S.srs[a].d - S.srs[b].d);
  const cap = TOPICS[scope] ? unseen.length : newLeft();
  return { due, fresh: unseen.slice(0, cap), unseenTotal: unseen.length };
}
function interleave(due, fr) { const out = []; let i = 0, j = 0; while (i < due.length || j < fr.length) { for (let k = 0; k < 3 && i < due.length; k++) out.push(due[i++]); if (j < fr.length) out.push(fr[j++]); } return out; }
function cardStats(scope) {
  let total = 0, seen = 0, mastered = 0;
  for (const t of topicsIn(scope)) for (const id of t.cardIds) { total++; const s = S.srs[id]; if (s) { seen++; if (s.i >= 21) mastered++; } }
  return { total, seen, mastered };
}
function streak() {
  let n = 0, t = Date.now();
  if (!S.log[dayKey(t)]) t -= DAY;
  while (S.log[dayKey(t)]) { n++; t -= DAY; }
  return n;
}
function logReview(wasNew) {
  const k = dayKey(); S.log[k] = (S.log[k] || 0) + 1;
  if (wasNew) S.newLog[k] = (S.newLog[k] || 0) + 1;
  const cutoff = dayKey(Date.now() - 8 * DAY);
  for (const d in S.newLog) if (d < cutoff) delete S.newLog[d];
}

/* ---------- Confidence ---------- */
function confOf(topics) {
  const c = { r: 0, a: 0, g: 0, u: 0, n: 0 };
  for (const t of topics) for (const id of t.pointIds) { c.n++; const v = S.conf[id]; if (v === 1) c.r++; else if (v === 2) c.a++; else if (v === 3) c.g++; else c.u++; }
  return c;
}
function cbar(c) {
  if (!c.n) return `<div class="cbar"></div>`;
  const w = x => (x / c.n * 100).toFixed(1) + "%";
  return `<div class="cbar" role="img" aria-label="${c.g} green, ${c.a} amber, ${c.r} red, ${c.u} not rated"><i class="g" style="width:${w(c.g)}"></i><i class="a" style="width:${w(c.a)}"></i><i class="r" style="width:${w(c.r)}"></i></div>`;
}
function weakness(t) {
  const c = confOf([t]); let lapses = 0, seen = 0;
  for (const id of t.cardIds) { const s = S.srs[id]; if (s) { seen++; lapses += s.l; } }
  const score = (c.r * 3 + c.a * 1.5 + c.u * 0.8) / Math.max(1, c.n) + (seen ? lapses / seen : 0.4);
  const why = c.r ? `${c.r} red spec point${c.r > 1 ? "s" : ""}` : lapses ? `${lapses} forgotten card${lapses > 1 ? "s" : ""}` : c.u === c.n ? "Not rated yet" : c.a ? `${c.a} amber` : "Keep it fresh";
  return { score, why };
}

function startStudy(scope, cram) {
  let queue, label;
  if (cram) { queue = shuffle(TOPICS[scope].cardIds.slice()); label = TOPICS[scope].t; }
  else { const q = queueFor(scope); queue = interleave(q.due, shuffle(q.fresh.slice())); label = TOPICS[scope] ? TOPICS[scope].t : subjName(scope); }
  if (!queue.length) { toast("No cards due here right now"); return; }
  ui.study = { queue, done: 0, flipped: false, res: [0, 0, 0, 0], cram: !!cram, scope, label };
  go("study");
}
function grade(g) {
  const s = ui.study; if (!s || !s.flipped) return;
  const id = s.queue.shift(), wasNew = !S.srs[id];
  S.srs[id] = schedule(id, g, Date.now());
  logReview(wasNew);
  s.res[g]++; s.done++; s.flipped = false;
  if (g === 0) s.queue.splice(Math.min(3, s.queue.length), 0, id);
  save(); render();
}

  ${answered ? `<div><button class="btn primary" data-act="quiz-next">${z.i + 1 < z.qs.length ? "Next question" : "See results"}</button></div>` : ""}`;

function startQuiz(scope, n) {
  const ids = []; for (const t of topicsIn(scope)) ids.push(...t.cardIds);
  if (ids.length < 4) { toast("Not enough cards in this topic for a quiz"); return; }
  const chosen = shuffle(ids.slice()).slice(0, Math.min(n, ids.length));
  const qs = chosen.map(id => {
    const c = CARDS[id];
    let pool = TOPICS[c.topic].cardIds.filter(x => x !== id && CARDS[x].a !== c.a);
    if (pool.length < 3) pool = pool.concat(topicsIn(c.subj).flatMap(t => t.cardIds).filter(x => x !== id && CARDS[x].a !== c.a && !pool.includes(x)));
    const opts = shuffle([c.a, ...shuffle(pool).slice(0, 3).map(x => CARDS[x].a)]);
    return { id, opts, ans: opts.indexOf(c.a), pick: null };
  });
  ui.quiz = { qs, i: 0, score: 0, scope, label: TOPICS[scope] ? TOPICS[scope].t : "Mixed " + subjName(scope) };
  go("quiz");
}

function tutorErr(e) {

  return code === "not_granted" ? "Claude access was declined for this page. You can allow it from the artifact's Permissions menu." : code === "rate_limited" ? "You've hit a usage limit. Try again in a little while." : "Claude couldn't answer that just now. Try again.";
}
async function tutorGenerate() {
  const T = ui.tutor, t = TOPICS[T.topic]; if (!t) return;
  T.busy = true; T.err = ""; T.mark = null; T.ans = ""; T.showScheme = false; T.q = null; render();
  try {
    const q = await SAMPLE.json(`You are a senior examiner for ${SUBJ_DESC(t.subj)}. Write ONE original exam-style question on "${t.code} ${t.t}" worth exactly ${T.marks} marks, in the style of real AQA papers: UK spelling, AQA command words (State, Explain, Calculate, Describe, Suggest, Deduce), SI units, and realistic data for any calculation. Keep it within these specification points:\n- ${t.pts.join("\n- ")}\nIf it has parts, label them (a), (b) with marks in brackets. Write formulae and units in plain text with Unicode superscripts and subscripts.\nReturn only JSON: {"question": string, "marks": number, "mark_scheme": [string, one per marking point, including accepted answers, alternatives and units], "model_answer": string}`, { modelTier: "default", cache: false });
    if (!q || !q.question) throw new Error("bad");
    T.q = { question: String(q.question), marks: +q.marks || T.marks, mark_scheme: Array.isArray(q.mark_scheme) ? q.mark_scheme.map(String) : [], model_answer: String(q.model_answer || "") };
  } catch (e) { T.err = tutorErr(e); }

}
async function tutorMark() {
  const T = ui.tutor, t = TOPICS[T.topic]; if (!T.q) return;
  if (!T.ans.trim()) { toast("Write an answer first"); return; }
  T.busy = true; T.err = ""; render();
  try {
    const m = await SAMPLE.json(`You are an AQA examiner for ${SUBJ_DESC(t.subj)}, marking a student's answer strictly against the mark scheme, as in a real exam. Award a mark only when the point is clearly made; accept equivalent correct wording and apply error-carried-forward in calculations as AQA does.\n\nQUESTION (${T.q.marks} marks):\n${T.q.question}\n\nMARK SCHEME:\n- ${T.q.mark_scheme.join("\n- ")}\n\nSTUDENT ANSWER:\n${T.ans}\n\nReturn only JSON: {"score": number, "out_of": ${T.q.marks}, "feedback": string (2 to 4 sentences: what was good and exactly how to gain the missing marks, addressed to the student as "you"), "met": [marking points awarded], "missed": [marking points not awarded, each saying what was needed]}`, { modelTier: "default", cache: false });
    T.mark = { score: Math.max(0, Math.min(+m.score || 0, T.q.marks)), out_of: T.q.marks, feedback: String(m.feedback || ""), met: (m.met || []).map(String), missed: (m.missed || []).map(String) };
  } catch (e) { T.err = tutorErr(e); }
  T.busy = false; render();
}
const chatPre = () => "You are a friendly, precise tutor for a student revising " + SUBJ_DESC(cur()) + " on a tablet. Stay within the AQA specification, use UK spelling and AQA terminology, show calculations step by step with units, and point out common exam mistakes where useful. Keep answers under about 250 words unless asked for more. Use plain text only: no Markdown symbols such as #, ** or tables; use Unicode for superscripts and subscripts.\n\nStudent's question: ";
async function askClaude(q) {
  const T = ui.tutor;
  T.chat.push({ role: "user", content: q }, { role: "assistant", content: "" });
  T.chatBusy = true; T.err = ""; render();
  const msgs = T.chat.slice(0, -1).map((m, i) => ({ role: m.role, content: i === 0 ? chatPre() + m.content : m.content }));
  try {

}

function paperChart(subj) {
  const ps = S.papers.filter(p => p.subj === subj).sort((a, b) => a.date.localeCompare(b.date));
  if (ps.length < 2) return "";
  const W = 640, H = 220, L = 36, Rr = 12, T = 12, B = 28;
  const t0 = new Date(ps[0].date).getTime(), t1 = Math.max(t0 + DAY, new Date(ps[ps.length - 1].date).getTime());
  const x = d => L + (new Date(d).getTime() - t0) / (t1 - t0) * (W - L - Rr), y = p => T + (1 - p / 100) * (H - T - B);
  let g = "";
  for (const v of [0, 25, 50, 75, 100]) g += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`;
  for (const s of ["phys", "chem"]) {
    const pts = ps.filter(p => p.subj === s); if (!pts.length) continue;
    const col = s === "phys" ? "var(--phys)" : "var(--chem)";
    g += `<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => x(p.date).toFixed(1) + "," + y(p.score / p.max * 100).toFixed(1)).join(" ")}"/>`;
    g += pts.map((p, i) => `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.score / p.max * 100).toFixed(1)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${col}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(p.series + " " + p.paper)}: ${Math.round(p.score / p.max * 100)}%</title></circle>`).join("");
  }
  g += `<text x="${L}" y="${H - 8}">${fmtDate(ps[0].date)}</text><text x="${W - Rr}" y="${H - 8}" text-anchor="end">${fmtDate(ps[ps.length - 1].date)}</text>`;
  return `<section class="panel"><div class="panel-head"><h2>Progress</h2><span class="muted small">Percentage per paper</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Past paper percentages over time">${g}</svg></section>`;
}

const TM = { mode: "focus", len: { focus: 25, short: 5, long: 15 }, left: 25 * 60, running: false, end: 0, iv: null, wake: null };

    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle id="tm-arc" cx="100" cy="100" r="88" fill="none" stroke="${TM.mode === "focus" ? "var(--ink)" : "var(--green)"}" stroke-width="10" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="${(2 * Math.PI * 88).toFixed(1)}"/><text id="tm-clock" x="100" y="112" text-anchor="middle" style="font:700 40px var(--f-mono);fill:var(--ink)"></text></svg>
    <div class="row"><button class="btn primary" data-act="tm-toggle" style="min-width:140px">${TM.running ? "Pause" : TM.left < TM.len[TM.mode] * 60 ? "Resume" : "Start"}</button><button class="btn" data-act="tm-reset">Reset</button></div>
    <label class="field" for="tm-len" style="width:200px">${TM.mode === "focus" ? "Focus" : "Break"} length (minutes)<input id="tm-len" type="number" min="1" max="180" value="${TM.len[TM.mode]}" data-change="tm-len" inputmode="numeric"></label>
    <p class="muted small" style="text-align:center;max-width:44ch">Work in focused blocks with your tablet's notifications off. The screen stays on while the timer runs.</p>

function drawTimer() {
  const clock = document.getElementById("tm-clock"), arc = document.getElementById("tm-arc"); if (!clock) return;
  const s = Math.max(0, Math.round(TM.left)); clock.textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
  const c = 2 * Math.PI * 88, f = s / (TM.len[TM.mode] * 60); arc.setAttribute("stroke-dashoffset", (c * (1 - f)).toFixed(1));
}
function tmTick() {
  TM.left = (TM.end - Date.now()) / 1000;
  if (TM.left <= 0) {
    TM.left = 0; tmStop();
    if (TM.mode === "focus") { const k = dayKey(); S.focus[k] = (S.focus[k] || 0) + 1; save(); }
    beep(); toast(TM.mode === "focus" ? "Focus block done. Take a break." : "Break over. Back to it.");
    TM.mode = TM.mode === "focus" ? "short" : "focus"; TM.left = TM.len[TM.mode] * 60;
    if (view === "timer") render();
  }
  if (view === "timer") drawTimer();
}
async function tmStart() {
  TM.running = true; TM.end = Date.now() + TM.left * 1000; TM.iv = setInterval(tmTick, 250);
  try { if (navigator.wakeLock) TM.wake = await navigator.wakeLock.request("screen"); } catch (e) { TM.wake = null; }
}
function tmStop() { TM.running = false; clearInterval(TM.iv); if (TM.wake) { TM.wake.release().catch(() => {}); TM.wake = null; } }
let AC = null;
function beep() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(d => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, AC.currentTime + d); g.gain.exponentialRampToValueAtTime(.3, AC.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d + .25); o.connect(g).connect(AC.destination); o.start(AC.currentTime + d); o.stop(AC.currentTime + d + .3); });
  } catch (e) { /* no audio */ }
}

  "vw-zoom": el => { const c = document.getElementById("vw-pages"); const f = c ? c.scrollTop / Math.max(1, c.scrollHeight) : 0; VW.zoom = Math.max(0.6, Math.min(3, VW.zoom * (el.dataset.v === "1" ? 1.25 : 0.8))); layoutPages(f); },
  "vw-done": () => { const c = VW.cur, k = c.subj + "|" + c.ser + "|" + c.label; if (S.ppDone[k]) delete S.ppDone[k]; else S.ppDone[k] = dayKey(); save(); const b = document.querySelector('[data-act="vw-done"]'); if (b) { b.textContent = S.ppDone[k] ? "✓ Done" : "Mark done"; b.classList.toggle("primary", !S.ppDone[k]); } render(); },
  "vw-log": () => { const c = VW.cur, m = c.label.match(/Paper \d/); closeViewer(false); if (cur() !== c.subj) S.settings.subj = c.subj; ui.prefill = { subj: c.subj, series: c.ser, paper: m ? m[0] : "" }; go("papers"); setTimeout(() => { const f = document.getElementById("log-paper"); if (f) f.scrollIntoView({ block: "start" }); }, 50); },
  "papers-clear": () => { ui.confirmClearPapers = true; render(); },
  "papers-clear-no": () => { ui.confirmClearPapers = false; render(); },
  "papers-clear-yes": async () => { try { await pdbOpen(); await pdbClear(); } catch (e) { /* ignore */ } ui.confirmClearPapers = false; render(); toast("Stored papers removed"); },
  "pp-done": el => { const k = el.dataset.v; if (S.ppDone[k]) delete S.ppDone[k]; else S.ppDone[k] = dayKey(); save(); render(); },
  "all-opts": () => { ui.allOpts = !ui.allOpts; render(); },
  "pp-log": el => {
    const m = el.dataset.p.match(/Paper \d/);
    ui.prefill = { subj: cur(), series: el.dataset.v, paper: m ? m[0] : "" }; render();
    const f = document.getElementById("log-paper"); if (f) f.scrollIntoView({ behavior: "smooth", block: "start" });
    const sc = document.getElementById("pp-score"); if (sc) setTimeout(() => sc.focus({ preventScroll: true }), 300);
  },
  "del-paper": el => { S.papers = S.papers.filter(p => p.id !== el.dataset.v); save(); render(); },
  "del-exam": el => { S.exams = S.exams.filter(p => p.id !== el.dataset.v); save(); render(); },
  "mk-filter": el => { ui.mistakeFilter = el.dataset.v; render(); },
  "mk-done": el => { const m = S.mistakes.find(x => x.id === el.dataset.v); if (m) { m.done = !m.done; save(); render(); } },
  "mk-del": el => { S.mistakes = S.mistakes.filter(x => x.id !== el.dataset.v); save(); render(); },
  "mk-card": el => { const m = S.mistakes.find(x => x.id === el.dataset.v); if (!m || !TOPICS[m.topic]) return; S.custom.push({ id: "u-" + uid(), topic: m.topic, q: "Avoid this mistake: " + m.what, a: m.fix }); m.card = true; indexCustom(); save(); render(); toast("Flashcard added to " + TOPICS[m.topic].t); },
  "tm-mode": el => { tmStop(); TM.mode = el.dataset.v; TM.left = TM.len[TM.mode] * 60; render(); },
  "tm-toggle": () => { if (TM.running) { tmStop(); TM.left = (TM.end - Date.now()) / 1000; } else { tmStart(); } render(); },
  "tm-reset": () => { tmStop(); TM.left = TM.len[TM.mode] * 60; render(); },
  theme: el => { S.settings.theme = el.dataset.v; save(); render(); },
  "backup-copy": el => {
    const txt = JSON.stringify(S);
    const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject();
    p.then(() => toast("Backup copied. Paste it somewhere safe.")).catch(() => { ui.backup = txt; render(); const t = document.getElementById("bk-out"); if (t) { t.focus(); t.select(); } });
  },
  "backup-save": async () => {
    if (OFFLINE) {
      const url = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = "lab-book-backup-" + dayKey() + ".json"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000); toast("Backup saved to your Downloads"); return;
    }
    const dl = await getDownloads();
    if (!dl) { ui.backup = JSON.stringify(S); render(); toast("Saving files isn't available here. Copy the backup text instead."); return; }
    try { await dl.save({ filename: "lab-book-backup-" + dayKey() + ".json", data: JSON.stringify(S) }); toast("Backup saved"); } catch (e) { toast("Backup not saved"); }
  },
  reset: () => { ui.confirmReset = true; render(); },
  "reset-no": () => { ui.confirmReset = false; render(); },
  "reset-yes": () => { const th = S.settings.theme; S = fresh(); S.settings.theme = th; indexCustom(); ui.confirmReset = false; ui.study = null; ui.quiz = null; save(); render(); toast("Progress erased"); }
};
const CHANGE = {
  "study-topic": el => { ui.studyTopic = el.value; render(); },
  "quiz-topic": el => { ui.quizTopic = el.value; },
  "tutor-topic": el => { ui.tutor.topic = el.value; ui.tutor.q = null; ui.tutor.mark = null; render(); },
  "tutor-marks": el => { ui.tutor.marks = +el.value; },
  import: el => { const files = [...(el.files || [])]; el.value = ""; if (files.length) importFiles(files); },
  "restore-file": el => {
    const f = el.files && el.files[0]; el.value = ""; if (!f) return;
    f.text().then(txt => { const o = JSON.parse(txt); if (!o || typeof o !== "object" || !o.srs) throw new Error("x"); S = normalise(o); indexCustom(); save(); ui.restoreMsg = "Backup restored."; render(); })
      .catch(() => { ui.restoreMsg = "That file isn't a Lab Book backup."; render(); });
  },
  photo: el => { ui.tutor.img = el.files && el.files[0] || null; ui.tutor.imgOut = ""; render(); },
  "tm-len": el => { const v = Math.max(1, Math.min(180, +el.value || 1)); TM.len[TM.mode] = v; if (!TM.running) TM.left = v * 60; render(); },
  "set-opt": el => { S.settings.physOpt = el.value; save(); render(); },
  "set-new": el => { S.settings.newPerDay = Math.max(0, Math.min(200, +el.value || 0)); save(); render(); }
};
let notesTimer = null;
const INPUT = {
  notes: el => { S.notes[el.dataset.v] = el.value; clearTimeout(notesTimer); notesTimer = setTimeout(save, 600); },
  "tutor-ans": el => { ui.tutor.ans = el.value; },
  "photo-note": el => { ui.tutor.imgNote = el.value; },
  fsearch: el => {
    ui.fsearch = el.value;
    const pos = el.selectionStart; render();
    const n = document.getElementById("fsearch"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } }
  }
};
const FORM = {
  "add-card": (f, data) => { S.custom.push({ id: "u-" + uid(), topic: f.dataset.v, q: data.get("q").trim(), a: data.get("a").trim() }); indexCustom(); save(); render(); toast("Card added"); },
  ask: (f, data) => { const q = data.get("q").trim(); if (q && !ui.tutor.chatBusy) askClaude(q); },
  paper: (f, data) => {
    const score = +data.get("score"), max = +data.get("max");
    if (score > max) { toast("Your mark can't be more than the total"); return; }
    S.papers.push({ id: uid(), subj: data.get("subj"), paper: data.get("paper"), series: data.get("series").trim(), score, max, date: data.get("date") });
    ui.prefill = null; save(); render(); toast("Paper saved");
  },
  exam: (f, data) => { S.exams.push({ id: uid(), subj: data.get("subj"), paper: data.get("paper"), date: data.get("date"), time: data.get("time") }); save(); render(); toast("Exam added"); },
  mistake: (f, data) => { S.mistakes.push({ id: uid(), topic: data.get("topic"), what: data.get("what").trim(), fix: data.get("fix").trim(), date: dayKey(), done: false }); save(); render(); toast("Mistake logged"); },
  restore: (f, data) => {
    try {
      const o = JSON.parse(data.get("data"));
      if (!o || typeof o !== "object" || !o.srs) throw new Error("x");
      S = normalise(o); indexCustom(); save(); ui.restoreMsg = "Backup restored."; render();
    } catch (e) { ui.restoreMsg = "That doesn't look like a Lab Book backup. Paste the whole backup text, starting with {"; render(); }
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("change", e => { const el = e.target.closest("[data-change]"); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e); });
document.addEventListener("input", e => { const el = e.target.closest("[data-input]"); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el, e); });
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault(); const fn = FORM[f.dataset.form]; if (fn) fn(f, new FormData(f));
});
document.addEventListener("change", e => {
  if (e.target.id === "pp-paper") { const o = e.target.selectedOptions[0], mx = document.getElementById("pp-max"); if (o && o.dataset.max && mx) mx.value = o.dataset.max; }
});
document.addEventListener("keydown", e => {
  if (view !== "study" || !ui.study || !ui.study.queue.length) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === " " || e.key === "Enter") { if (!ui.study.flipped) { e.preventDefault(); ACT.flip(); } }
  else if (ui.study.flipped && !ui.study.cram && "1234".includes(e.key)) { e.preventDefault(); grade(+e.key - 1); }
});

render();
initClaude();
})();

</script>
<script>if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(function () {});</script>
